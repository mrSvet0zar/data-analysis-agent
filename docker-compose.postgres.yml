# Overlay that swaps the job store from SQLite to PostgreSQL.
# Mirrors what Railway's Postgres plugin does in production (it injects
# DATABASE_URL); needed once the API runs as more than one replica.
#
#   ANTHROPIC_API_KEY=sk-ant-... \
#     docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
services:
  backend:
    environment:
      DATABASE_URL: postgresql://postgres:pw@postgres:5432/agent
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: agent
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
