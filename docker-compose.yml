# Local dev/prod-parity stack: backend API + built frontend.
#
#   Durable SQLite on a volume (default — mirrors "Railway + volume"):
#     ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
#
#   PostgreSQL instead (mirrors "Railway + Postgres plugin", needed for replicas):
#     ANTHROPIC_API_KEY=sk-ant-... \
#       docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      # Job history lives on the named volume below, so it survives restarts.
      DB_PATH: /data/jobs.db
    volumes:
      - job_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  job_data:
